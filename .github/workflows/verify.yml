name: Verify runtime contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify standard-library imports and Python 3.10 syntax
        run: python scripts/verify_runtime_contracts.py
      - name: Run the full suite and reject ignored finalizer errors
        run: python -W error::ResourceWarning scripts/run_verified_tests.py
      - name: Compile Python sources
        run: python -m compileall -q play_anything tests scripts
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run all dependency-free Node contract tests
        run: node --test tests/js/*.test.mjs
      - name: Note optional PNG integration coverage
        run: echo "PNG CLI integration tests skip without Sharp; Sharp is optional and is not a runtime dependency."
